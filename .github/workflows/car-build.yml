name: Build Car APK

# Builds the IzzyOnDroid flavor (no in-app updater, no Cast) and signs it with
# this fork's own key. The updater is left out on purpose: it would offer the
# upstream APK, which is signed with a different key and cannot install over
# this build.

on:
  workflow_dispatch:
  push:
    branches: ["car-scale"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleIzzyRelease --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music
          METROLIST_APP_NAME: Metrolist
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/izzy/release/
          signingKey: ${{ secrets.CAR_KEYSTORE }}
          keyAlias: ${{ secrets.CAR_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.CAR_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.CAR_KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Collect signed APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/izzy/release"
          mkdir -p out
          find "$OUTPUT_DIR" -name "*-signed.apk" | head -1 | xargs -I{} cp {} out/Metrolist-car.apk
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Metrolist-car
          path: out/Metrolist-car.apk
          if-no-files-found: error
